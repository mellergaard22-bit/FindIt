<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skur & Skuffe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Auth State
            const [user, setUser] = useState(null);
            const [isLoginView, setIsLoginView] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');

            // App State
            const [activeTab, setActiveTab] = useState('search');
            const [searchQuery, setSearchQuery] = useState('');
            
            // Persistent Boxes in localStorage (simulating cloud database)
            const [boxes, setBoxes] = useState(() => {
                const saved = localStorage.getItem('skur_boxes');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 'box-1',
                        title: 'Kasse 4 - El-stumper & Ledninger',
                        location: 'Værksted - Reol B',
                        image: 'https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=600&q=80',
                        items: [
                            { name: 'Gaffatape', synonyms: ['sølvtape', 'duct tape', 'tape'], category: 'Forbrug', hint: 'Øverst i højre hjørne' },
                            { name: 'Stikdåse 3-vejs', synonyms: ['forlængerled', 'strømskinne'], category: 'El', hint: 'Midt i kassen' }
                        ]
                    }
                ];
            });

            const [loans, setLoans] = useState([
                { id: '1', item: 'Stiksav', borrower: 'Henrik Nabo', date: '2026-05-10', returned: false }
            ]);

            const [shoppingList, setShoppingList] = useState([
                { id: '1', item: 'Gaffatape (sidste rulle brugt)', checked: false }
            ]);

            const [isPro, setIsPro] = useState(false);
            const [showMobilePayModal, setShowMobilePayModal] = useState(false);
            const [mobileNumber, setMobileNumber] = useState('');
            const [payStep, setPayStep] = useState('input');
            const [discountCode, setDiscountCode] = useState('');
            const [codeMessage, setCodeMessage] = useState('');

            // Admin state
            const [logoClicks, setLogoClicks] = useState(0);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminCodeInput, setAdminCodeInput] = useState('');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminCustomCodes, setAdminCustomCodes] = useState(['GRATIS100', 'VENNER', 'SKURPRO', 'FALCK']);

            // Save boxes to localStorage whenever they change
            useEffect(() => {
                localStorage.setItem('skur_boxes', JSON.stringify(boxes));
            }, [boxes]);

            // Check if user was previously logged in
            useEffect(() => {
                const savedUser = localStorage.getItem('skur_user');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                }
            }, []);

            // Biometric Login Simulation (FaceID / TouchID)
            const handleBiometricLogin = () => {
                if (window.PublicKeyCredential) {
                    // Simulating biometric prompt
                    const mockUser = { email: 'martin@skur.dk', uid: 'user_biometric_123' };
                    setUser(mockUser);
                    localStorage.setItem('skur_user', JSON.stringify(mockUser));
                } else {
                    alert('Biometrisk login understøttes ikke på denne enhed. Brug e-mail/adgangskode.');
                }
            };

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                if (!email || !password) {
                    setAuthError('Udfyld venligst alle felter');
                    return;
                }
                const newUser = { email, uid: 'user_' + Date.now() };
                setUser(newUser);
                localStorage.setItem('skur_user', JSON.stringify(newUser));
                setAuthError('');
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('skur_user');
            };

            const handleLogoClick = () => {
                const newClicks = logoClicks + 1;
                setLogoClicks(newClicks);
                if (newClicks >= 15) {
                    setLogoClicks(0);
                    setShowAdminModal(true);
                }
                setTimeout(() => setLogoClicks(0), 4000);
            };

            const handleDiscountSubmit = (e) => {
                e.preventDefault();
                const code = discountCode.trim().toUpperCase();
                
                if (code === '06161821') {
                    setIsAdminLoggedIn(true);
                    setShowAdminModal(true);
                    setCodeMessage('Admin-adgang godkendt!');
                    return;
                }

                if (adminCustomCodes.includes(code) || ['GRATIS100', 'VENNER', 'SKURPRO', 'FALCK'].includes(code)) {
                    setIsPro(true);
                    setCodeMessage('Rabatkode godkendt! Du har nu fuld PRO-adgang.');
                    setDiscountCode('');
                } else {
                    setCodeMessage('Ugyldig rabatkode.');
                }
            };

            const triggerMobilePay = (e) => {
                e.preventDefault();
                if (mobileNumber.length < 8) {
                    alert('Indtast venligst et gyldigt mobilnummer');
                    return;
                }
                setPayStep('waiting');
                setTimeout(() => {
                    setPayStep('success');
                    setTimeout(() => {
                        setIsPro(true);
                        setShowMobilePayModal(false);
                        setPayStep('input');
                        setMobileNumber('');
                    }, 2000);
                }, 2500);
            };

            const filteredBoxes = boxes.filter(box => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                const matchTitle = box.title.toLowerCase().includes(q) || box.location.toLowerCase().includes(q);
                const matchItem = box.items.some(i => 
                    i.name.toLowerCase().includes(q) || 
                    i.category.toLowerCase().includes(q) ||
                    i.synonyms.some(s => s.toLowerCase().includes(q))
                );
                return matchTitle || matchItem;
            });

            // If not logged in, show Login / Register Screen
            if (!user) {
                return (
                    <div className="max-w-md mx-auto min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-center p-6 shadow-2xl">
                        <div className="text-center space-y-3 mb-8">
                            <div className="w-16 h-16 bg-amber-500 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg">
                                📦
                            </div>
                            <h1 className="text-2xl font-black">Skur & Skuffe</h1>
                            <p className="text-sm text-slate-400">Log ind for at synkronisere dine kasser i skyen</p>
                        </div>

                        <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 space-y-4 shadow-xl">
                            {authError && <p className="text-xs text-red-400 text-center">{authError}</p>}
                            
                            <form onSubmit={handleAuthSubmit} className="space-y-4">
                                <div className="space-y-1">
                                    <label className="text-xs text-slate-300">E-mail</label>
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="din@email.dk"
                                        className="w-full bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-500"
                                    />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-xs text-slate-300">Adgangskode</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        className="w-full bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-500"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3.5 rounded-xl shadow-lg transition">
                                    {isLoginView ? 'Log ind' : 'Opret konto'}
                                </button>
                            </form>

                            {/* Biometric Login Button */}
                            <button 
                                onClick={handleBiometricLogin}
                                className="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2 transition text-sm border border-slate-600"
                            >
                                <span>🔒</span> Brug Ansigtsgenkendelse / Fingeraftryk
                            </button>

                            <div className="text-center pt-2">
                                <button 
                                    onClick={() => setIsLoginView(!isLoginView)} 
                                    className="text-xs text-amber-400 hover:underline"
                                >
                                    {isLoginView ? 'Har du ikke en konto? Opret her' : 'Har du allerede en konto? Log ind'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-900 text-slate-100 flex flex-col shadow-2xl pb-24">
                    {/* Top Header */}
                    <header className="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center sticky top-0 z-20">
                        <div onClick={handleLogoClick} className="cursor-pointer select-none flex items-center gap-2">
                            <div className="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center font-bold text-slate-900 shadow-md">
                                📦
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight">Skur & Skuffe</h1>
                                <p className="text-xs text-slate-400 truncate max-w-[120px]">{user.email}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            {isPro ? (
                                <span className="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-amber-500/30">
                                    ★ PRO
                                </sp>
                            ) : (
                                <button onClick={() => setShowMobilePayModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow transition">
                                    Opgrader PRO
                                </button>
                            )}
                            <button onClick={handleLogout} title="Log ud" className="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-700 rounded">
                                ⎋
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 p-4 overflow-y-auto">
                        {activeTab === 'search' && (
                            <div className="space-y-4">
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                                        🔍
                                    </span>
                                    <input 
                                        type="text" 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Søg efter ting, kasser eller synonymer..." 
                                        className="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-500 shadow-inner"
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white">
                                            ✕
                                        </button>
                                    )}
                                </div>

                                <div className="flex gap-2 overflow-x-auto pb-1 text-xs">
                                    {['Gaffatape', 'Karburator', 'Stikdåse', 'Pløkker'].map((tag) => (
                                        <button 
                                            key={tag} 
                                            onClick={() => setSearchQuery(tag)}
                                            className="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap text-slate-300 transition"
                                        >
                                            #{tag}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex justify-between items-center text-xs text-slate-400 pt-2">
                                    <span>Viser {filteredBoxes.length} kasser</span>
                                    <span>{boxes.reduce((acc, b) => acc + b.items.length, 0)} ting total</span>
                                </div>

                                <div className="space-y-4">
                                    {filteredBoxes.map((box) => (
                                        <div key={box.id} className="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg hover:border-slate-600 transition">
                                            <div className="relative h-44 bg-slate-700">
                                                <img src={box.image} alt={box.title} className="w-full h-full object-cover" />
                                                <div className="absolute top-2 right-2 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-lg text-xs font-medium text-amber-400 border border-slate-700">
                                                    📍 {box.location}
                                                </div>
                                            </div>
                                            <div className="p-4 space-y-3">
                                                <h3 className="font-bold text-base text-slate-100">{box.title}</h3>
                                                <div className="space-y-1.5">
                                                    {box.items.map((item, idx) => (
                                                        <div key={idx} className="bg-slate-900/60 p-2 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
                                                            <div>
                                                                <span className="font-semibold text-amber-300">{item.name}</span>
                                                                <p className="text-xs text-slate-400">💡 {item.hint}</p>
                                                            </div>
                                                            <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">
                                                                {item.category}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'scan' && (
                            <div className="space-y-6 text-center py-6">
                                <div className="bg-slate-800 border-2 border-dashed border-slate-600 rounded-3xl p-8 flex flex-col items-center justify-center space-y-4">
                                    <div className="w-20 h-20 bg-amber-500/10 rounded-full flex items-center justify-center text-amber-400 text-3xl">
                                        📷
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg text-white">Skan ny kasse eller skuffe</h3>
                                        <p className="text-sm text-slate-400 mt-1">Tag et billede, så gemmes det fast på din konto.</p>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            if (!isPro && boxes.length >= 5) {
                                                setShowMobilePayModal(true);
                                                return;
                                            }
                                            const title = prompt("Indtast kassenavn:", "Kasse " + (boxes.length + 1) + " - Diverse");
                                            if (title) {
                                                const newBox = {
                                                    id: 'box-' + Date.now(),
                                                    title: title,
                                                    location: 'Værksted',
                                                    image: 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=600&q=80',
                                                    items: [
                                                        { name: 'Skruemaskine', synonyms: ['boremaskine'], category: 'El-værktøj', hint: 'Ligger øverst' },
                                                        { name: 'Bits-sæt', synonyms: ['torx'], category: 'Tilbehør', hint: 'I side-lomme' }
                                                    ]
                                                };
                                                setBoxes([newBox, ...boxes]);
                                                alert('Kasse gemt fast!');
                                                setActiveTab('search');
                                            }
                                        }}
                                        className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3.5 px-6 rounded-xl shadow-lg transition"
                                    >
                                        + Tag Billede / Skan Kasse
                                    </button>
                                </div>
                                {!isPro && (
                                    <p className="text-xs text-slate-400">
                                        Du bruger gratis-versionen ({boxes.length}/5 kasser oprettet). <button onClick={() => setShowMobilePayModal(true)} className="text-amber-400 underline">Få ubegrænset her</button>
                                    </p>
                                )}
                            </div>
                        )}

                        {activeTab === 'loans' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold">Udlån & Indkøbsliste</h2>
                                <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                                    <h3 className="font-semibold text-sm text-amber-400">Udlånte ting</h3>
                                    {loans.map(loan => (
                                        <div key={loan.id} className="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 text-sm">
                                            <div>
                                                <span className="font-medium">{loan.item}</span>
                                                <p className="text-xs text-slate-400">Lånt ud til: {loan.borrower} ({loan.date})</p>
                                            </div>
                                            <button 
                                                onClick={() => setLoans(loans.filter(l => l.id !== loan.id))}
                                                className="text-xs bg-emerald-600/20 text-emerald-400 px-2.5 py-1 rounded border border-emerald-500/30"
                                            >
                                                Afleveret ✓
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                                    <h3 className="font-semibold text-sm text-amber-400">Byggemarked Indkøbsliste</h3>
                                    {shoppingList.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 text-sm">
                                            <span>{item.item}</span>
                                            <button 
                                                onClick={() => setShoppingList(shoppingList.filter(i => i.id !== item.id))}
                                                className="text-xs text-slate-400 hover:text-white"
                                            >
                                                Slet ✕
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'pro' && (
                            <div className="space-y-6 py-2">
                                <div className="bg-gradient-to-br from-amber-500/20 to-slate-800 border border-amber-500/40 rounded-3xl p-6 text-center space-y-3">
                                    <div className="w-14 h-14 bg-amber-500 text-slate-900 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold shadow-lg">
                                        ★
                                    </div>
                                    <h2 className="text-xl font-extrabold text-white">Skur & Skuffe PRO</h2>
                                    <p className="text-sm text-slate-300">
                                        Få ubegrænsede kasser, QR-label print og fast sky-synkronisering på tværs af enheder.
                                    </p>
                                    <div className="pt-2">
                                        <button 
                                            onClick={() => setShowMobilePayModal(true)}
                                            className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3.5 px-6 rounded-xl shadow-lg transition"
                                        >
                                            Opgrader med MobilePay
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3">
                                    <h3 className="font-semibold text-sm text-slate-200">Har du en rabatkode?</h3>
                                    <form onSubmit={handleDiscountSubmit} className="flex gap-2">
                                        <input 
                                            type="text" 
                                            value={discountCode}
                                            onChange={(e) => setDiscountCode(e.target.value)}
                                            placeholder="Indtast kode her..."
                                            className="flex-1 bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-sm uppercase text-slate-100 focus:outline-none focus:border-amber-500"
                                        />
                                        <button type="submit" className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm font-medium transition">
                                            Indløs
                                        </button>
                                    </form>
                                    {codeMessage && <p className="text-xs text-amber-400">{codeMessage}</p>}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-800 border-t border-slate-700 flex justify-around p-3 z-20">
                        <button onClick={() => setActiveTab('search')} className={`flex flex-col items-center gap-1 text-xs ${activeTab === 'search' ? 'text-amber-400 font-bold' : 'text-slate-400'}`}>
                            <span className="text-lg">🔎</span> Søgning
                        </button>
                        <button onClick={() => setActiveTab('scan')} className={`flex flex-col items-center gap-1 text-xs ${activeTab === 'scan' ? 'text-amber-400 font-bold' : 'text-slate-400'}`}>
                            <span className="text-lg">📷</span> Skan Kasse
                        </button>
                        <button onClick={() => setActiveTab('loans')} className={`flex flex-col items-center gap-1 text-xs ${activeTab === 'loans' ? 'text-amber-400 font-bold' : 'text-slate-400'}`}>
                            <span className="text-lg">📋</span> Udlån
                        </button>
                        <button onClick={() => setActiveTab('pro')} className={`flex flex-col items-center gap-1 text-xs ${activeTab === 'pro' ? 'text-amber-400 font-bold' : 'text-slate-400'}`}>
                            <span className="text-lg">★</span> PRO
                        </button>
                    </nav>

                    {/* MobilePay Modal */}
                    {showMobilePayModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-3xl p-6 space-y-5 shadow-2xl relative">
                                <button onClick={() => { setShowMobilePayModal(false); setPayStep('input'); }} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                                <div className="text-center space-y-1">
                                    <div className="w-12 h-12 bg-red-600 text-white rounded-2xl mx-auto flex items-center justify-center font-bold text-xl shadow">M</div>
                                    <h3 className="font-bold text-lg">MobilePay Betaling</h3>
                                    <p className="text-xs text-slate-400">Skur & Skuffe PRO (Livstid)</p>
                                </div>
                                {payStep === 'input' && (
                                    <form onSubmit={triggerMobilePay} className="space-y-4">
                                        <div className="bg-slate-900 p-4 rounded-2xl border border-slate-700 text-center">
                                            <span className="text-xs text-slate-400">Samlet beløb</span>
                                            <div className="text-2xl font-black text-amber-400">199,00 kr.</div>
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs text-slate-300">Indtast dit MobilePay telefonnummer</label>
                                            <div className="flex rounded-xl overflow-hidden border border-slate-700 bg-slate-900">
                                                <span className="bg-slate-800 px-3 py-3 text-sm text-slate-400 border-r border-slate-700">+45</span>
                                                <input type="tel" maxLength="8" value={mobileNumber} onChange={(e) => setMobileNumber(e.target.value)} placeholder="12 34 56 78" className="w-full bg-transparent px-3 py-3 text-sm focus:outline-none text-slate-100" />
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">Godkend med MobilePay</button>
                                    </form>
                                )}
                                {payStep === 'waiting' && (
                                    <div className="text-center py-8 space-y-4">
                                        <div className="w-12 h-12 border-4 border-red-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                        <p className="text-sm font-medium text-slate-200">Åbn din MobilePay app og godkend...</p>
                                    </div>
                                )}
                                {payStep === 'success' && (
                                    <div className="text-center py-8 space-y-3">
                                        <div className="w-14 h-14 bg-emerald-600 text-white rounded-full mx-auto flex items-center justify-center text-2xl font-bold">✓</div>
                                        <h4 className="font-bold text-lg text-emerald-400">Betaling gennemført!</h4>
                                        <p className="text-xs text-slate-400">Du har nu fuld PRO-adgang.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Admin Modal */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-amber-500/50 w-full max-w-md rounded-3xl p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <button onClick={() => { setShowAdminModal(false); setIsAdminLoggedIn(false); }} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                                {!isAdminLoggedIn ? (
                                    <form onSubmit={(e) => { e.preventDefault(); if(adminCodeInput === '06161821') setIsAdminLoggedIn(true); else alert('Forkert kode'); }} className="space-y-4 py-4">
                                        <div className="text-center space-y-1">
                                            <div className="text-3xl">🔐</div>
                                            <h3 className="font-bold text-lg text-amber-400">Administrator-adgang</h3>
                                            <p className="text-xs text-slate-400">Indtast din 8-cifrede admin-kode</p>
                                        </div>
                                        <input type="password" maxLength="8" value={adminCodeInput} onChange={(e) => setAdminCodeInput(e.target.value)} placeholder="8-cifret kode" className="w-full bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl text-center text-lg tracking-widest text-slate-100 focus:outline-none focus:border-amber-500" />
                                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-xl transition">Log ind</button>
                                    </form>
                                ) : (
                                    <div className="space-y-4">
                                        <h3 className="font-bold text-base text-amber-400 border-b border-slate-700 pb-3">📊 Admin Dashboard</h3>
                                        <div className="grid grid-cols-2 gap-3 text-center">
                                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-700"><span className="text-xs text-slate-400">Lagrede Kasser</span><div className="text-xl font-bold text-white mt-1">{boxes.length}</div></div>
                                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-700"><span className="text-xs text-slate-400">Bruger</span><div className="text-xs font-bold text-amber-400 mt-2 truncate">{user.email}</div></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
