<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt - Værkøjs- og Kassestyring</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlJmARApFdDzjmXolh08K-7cDPOmt1P8Y",
            authDomain: "findit-8f7bb.firebaseapp.com",
            projectId: "findit-8f7bb",
            storageBucket: "findit-8f7bb.firebasestorage.app",
            messagingSenderId: "1075734374888",
            appId: "1:1075734374888:web:3a7e5c2af58f0e6dc35c5d",
            measurementId: "G-KKWK2DB3H8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.fbFns = { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, onSnapshot, setDoc };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [user, setUser] = useState(null);
            const [isLoginView, setIsLoginView] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');

            const [activeTab, setActiveTab] = useState('search');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [boxes, setBoxes] = useState([]);
            const [loans, setLoans] = useState([]);
            const [shoppingList, setShoppingList] = useState([]);

            const [newItemName, setNewItemName] = useState('');
            const [newBorrower, setNewBorrower] = useState('');
            const [newShopItem, setNewShopItem] = useState('');

            const [isPro, setIsPro] = useState(false);
            const [showMobilePayModal, setShowMobilePayModal] = useState(false);
            const [mobileNumber, setMobileNumber] = useState('');
            const [payStep, setPayStep] = useState('input');
            const [discountCode, setDiscountCode] = useState('');
            const [codeMessage, setCodeMessage] = useState('');

            // AI Scan states
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [aiAnalysisResult, setAiAnalysisResult] = useState(null);
            const [capturedImage, setCapturedImage] = useState(null);

            // Admin state
            const [logoClicks, setLogoClicks] = useState(0);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminCodeInput, setAdminCodeInput] = useState('');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminCustomCodes, setAdminCustomCodes] = useState(['GRATIS100', 'VENNER', 'FINDITPRO', 'FALCK']);
            const [newCustomCode, setNewCustomCode] = useState('');

            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.firebaseAuth && window.fbFns) {
                        setFirebaseReady(true);
                        clearInterval(checkFirebase);
                        window.fbFns.onAuthStateChanged(window.firebaseAuth, (u) => {
                            setUser(u);
                        });
                    }
                }, 100);
                return () => clearInterval(checkFirebase);
            }, []);

            // Hent data fra Firestore når bruger er logget ind
            useEffect(() => {
                if (!user || !firebaseReady) return;
                
                const unsubBoxes = window.fbFns.onSnapshot(window.fbFns.collection(window.firebaseDb, `users/${user.uid}/boxes`), (snapshot) => {
                    const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (data.length > 0) {
                        setBoxes(data);
                    } else {
                        const defaultBox = {
                            title: 'Kasse 4 - El-stumper & Ledninger',
                            location: 'Værksted - Reol B',
                            image: 'https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=600&q=80',
                            items: [
                                { name: 'Gaffatape', quantity: 4, category: 'Forbrug', hint: 'Øverst i højre hjørne' },
                                { name: 'Stikdåse 3-vejs', quantity: 2, category: 'El', hint: 'Midt i kassen' }
                            ]
                        };
                        window.fbFns.addDoc(window.fbFns.collection(window.firebaseDb, `users/${user.uid}/boxes`), defaultBox);
                    }
                });

                const unsubLoans = window.fbFns.onSnapshot(window.fbFns.collection(window.firebaseDb, `users/${user.uid}/loans`), (snapshot) => {
                    setLoans(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubShop = window.fbFns.onSnapshot(window.fbFns.collection(window.firebaseDb, `users/${user.uid}/shopping`), (snapshot) => {
                    setShoppingList(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => {
                    unsubBoxes();
                    unsubLoans();
                    unsubShop();
                };
            }, [user, firebaseReady]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    if (isLoginView) {
                        await window.fbFns.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                    } else {
                        await window.fbFns.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                    }
                } catch (err) {
                    setAuthError('Fejl ved login/oprettelse: ' + err.message);
                }
            };

            const handleLogout = () => {
                window.fbFns.signOut(window.firebaseAuth);
            };

            const handleLogoClick = () => {
                const newClicks = logoClicks + 1;
                setLogoClicks(newClicks);
                if (newClicks >= 15) {
                    setLogoClicks(0);
                    setShowAdminModal(true);
                }
                setTimeout(() => setLogoClicks(0), 4000);
            };

            const updateItemQuantity = async (boxId, itemIdx, delta) => {
                const box = boxes.find(b => b.id === boxId);
                if (!box) return;
                const updatedItems = [...box.items];
                const currentQty = updatedItems[itemIdx].quantity || 1;
                updatedItems[itemIdx].quantity = Math.max(0, currentQty + delta);

                await window.fbFns.updateDoc(window.fbFns.doc(window.firebaseDb, `users/${user.uid}/boxes`, boxId), {
                    items: updatedItems
                });
            };

            const handleCreateLoan = async (e) => {
                e.preventDefault();
                if (!newItemName.trim() || !newBorrower.trim()) {
                    alert('Udfyld venligst både genstand og hvem der låner den.');
                    return;
                }
                await window.fbFns.addDoc(window.fbFns.collection(window.firebaseDb, `users/${user.uid}/loans`), {
                    item: newItemName.trim(),
                    borrower: newBorrower.trim(),
                    date: new Date().toISOString().slice(0, 10)
                });
                setNewItemName('');
                setNewBorrower('');
            };

            const deleteLoan = async (id) => {
                await window.fbFns.deleteDoc(window.fbFns.doc(window.firebaseDb, `users/${user.uid}/loans`, id));
            };

            const handleAddShoppingItem = async (e) => {
                e.preventDefault();
                if (!newShopItem.trim()) return;
                await window.fbFns.addDoc(window.fbFns.collection(window.firebaseDb, `users/${user.uid}/shopping`), {
                    item: newShopItem.trim()
                });
                setNewShopItem('');
            };
