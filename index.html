<!DOCTYPE html>
<html lang="da">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt - Værkøjs- og Kassestyring</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 1) Sikker JSON-helper
        const safeParseJSON = (value, fallback) => {
            if (!value) return fallback;
            try {
                return JSON.parse(value);
            } catch (error) {
                console.warn('Kunne ikke parse JSON fra localStorage:', error);
                return fallback;
            }
        };

        function App() {
            // Auth State
            const [user, setUser] = useState(null);
            const [isLoginView, setIsLoginView] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');

            // Enhedsstyring / Device Limit State (Maks 3 enheder pr. bruger)
            const [showDeviceLimitModal, setShowDeviceLimitModal] = useState(false);
            const [activeDevices, setActiveDevices] = useState([

                { id: 'dev-3', name: 'Samsung Galaxy S22', lastActive: 'For 3 dage siden' }
            ]);

            // App State
            const [activeTab, setActiveTab] = useState('search');

            // 2) Gør boxes-initialisering robust
            const [boxes, setBoxes] = useState(() => {
                const saved = localStorage.getItem('findit_boxes');
                const parsed = safeParseJSON(saved, null);
                if (parsed && Array.isArray(parsed)) return parsed;
                return [
                    {
                        id: 'box-1',
                        title: 'Kasse 4 - El-stumper & Ledninger',
                        location: 'Værksted - Reol B',
                        image: 'https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=600&q=80',
                        items: [
                            { name: 'Gaffatape', quantity: 4, synonyms: ['sølvtape', 'duct tape', 'tape'], category: 'Forbrug', hint: 'Øverst i højre hjørne' },
                            { name: 'Stikdåse 3-vejs', quantity: 2, synonyms: ['forlængerled', 'strømskinne'], category: 'El', hint: 'Midt i kassen' }
                        ]
                    }
                ];
            });

            const [loans, setLoans] = useState([
                { id: '1', item: 'Stiksav', borrower: 'Henrik Nabo', date: '2026-05-10', returned: false }
            ]);

            const [shoppingList, setShoppingList] = useState([
                { id: '1', item: 'Gaffatape (sidste rulle brugt)', checked: false }
            ]);

            const [isPro, setIsPro] = useState(false);
            const [showMobilePayModal, setShowMobilePayModal] = useState(false);
            const [mobileNumber, setMobileNumber] = useState('');
            const [payStep, setPayStep] = useState('input');
            const [discountCode, setDiscountCode] = useState('');
            const [codeMessage, setCodeMessage] = useState('');

            // AI Scan & Analysis state
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [aiAnalysisResult, setAiAnalysisResult] = useState(null);
            const [capturedImage, setCapturedImage] = useState(null);

            // Admin state & metrics
            const [logoClicks, setLogoClicks] = useState(0);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminCodeInput, setAdminCodeInput] = useState('');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminCustomCodes, setAdminCustomCodes] = useState(['GRATIS100', 'VENNER', 'FINDITPRO', 'FALCK']);
            const [newCustomCode, setNewCustomCode] = useState('');
            
            const [allUsers, setAllUsers] = useState([
                { email: 'martin_meller@hotmail.com', role: 'Admin / PRO', joined: '2026-10-01' },
                { email: 'testbruger@vaerksted.dk', role: 'Gratis (3 kasser)', joined: '2026-10-22' },
                { email: 'henrik.nabo@byg.dk', role: 'PRO Abonnement', joined: '2026-10-23' }
            ]);

            // 8) Gem boxes mere sikkert
            useEffect(() => {
                try {
                    localStorage.setItem('findit_boxes', JSON.stringify(boxes));
                } catch (error) {
                    console.warn('Kunne ikke gemme boxes i localStorage:', error);
                }
            }, [boxes]);

            // 3) Gør bruger-læsning fra localStorage sikker
            useEffect(() => {
                const savedUser = localStorage.getItem('findit_user');
                const parsedUser = safeParseJSON(savedUser, null);
                if (parsedUser) {
                    setUser(parsedUser);
                }
            }, []);

            // 5) Gør biometrisk login enheds-bevidst
            const handleBiometricLogin = () => {
                if (!window.PublicKeyCredential) {
                    alert('Biometrisk login understøttes ikke på denne enhed.');
                    return;
                }
                if (activeDevices.length >= 3) {
                    setShowDeviceLimitModal(true);
                    return;
                }
                const mockUser = { email: 'martin_meller@hotmail.com', uid: 'user_biometric_123' };
                setUser(mockUser);
                localStorage.setItem('findit_user', JSON.stringify(mockUser));
                const deviceId = 'dev-' + Date.now();
                setActiveDevices(prev => [
                    ...prev,
                    {
                        id: deviceId,
                        name: 'Biometrisk enhed',
                        lastActive: 'Lige nu'
                    }
                ].slice(-3));
            };

            // 4) Split login og oprettelse af konto
            const completeLogin = (userEmail) => {
                const newUser = { email: userEmail, uid: 'user_' + Date.now() };
                setUser(newUser);
                localStorage.setItem('findit_user', JSON.stringify(newUser));
                setAuthError('');
                setShowDeviceLimitModal(false);
                
                const deviceId = 'dev-' + Date.now();
                setActiveDevices(prev => [
                    ...prev,
                    {
                        id: deviceId,
                        name: navigator.userAgent || 'Ukendt enhed',
                        lastActive: 'Lige nu'
                    }
                ].slice(-3));
            };

            const completeSignup = (userEmail) => {
                const existingUser = allUsers.find(u => u.email.toLowerCase() === userEmail.toLowerCase());
                if (existingUser) {
                    setAuthError('Der findes allerede en bruger med den e-mail.');
                    return;
                }
                const newUser = { 
                    email: userEmail, 
                    role: 'Gratis (3 kasser)', 
                    joined: new Date().toISOString().slice(0, 10) 
                };
                setAllUsers(prev => [...prev, newUser]);
                completeLogin(userEmail);
            };

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                if (!email || !password) {
                    setAuthError('Udfyld venligst alle felter');
                    return;
                }
                if (!isLoginView) {
                    completeSignup(email);
                    return;
                }
                if (activeDevices.length >= 3) {
                    setShowDeviceLimitModal(true);
                    return;
                }
                completeLogin(email);
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('findit_user');
            };

            const handleLogoClick = () => {
                const newClicks = logoClicks + 1;
                setLogoClicks(newClicks);
                if (newClicks >= 15) {
                    setLogoClicks(0);
                    setShowAdmin
